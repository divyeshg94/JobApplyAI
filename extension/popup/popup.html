<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>JobApplyAi</title>
  <style>
    body { font-family: system-ui, sans-serif; width: 300px; padding: 12px; }
    h3 { margin: 0 0 8px; }
    label { display: block; margin-top: 8px; font-size: 12px; color: #333; }
    input { width: 100%; box-sizing: border-box; padding: 5px; margin-top: 2px; }
    button { margin-top: 10px; width: 100%; padding: 6px; cursor: pointer; }
    #status { margin-top: 10px; font-size: 12px; white-space: pre-wrap; color: #333; }
    #context { margin-top: 12px; font-size: 12px; border-top: 1px solid #ddd; padding-top: 8px; }
    #context a { display: inline-block; margin-top: 4px; }
  </style>
</head>
<body>
  <h3>JobApplyAi</h3>

  <label>API base URL
    <input id="apiBaseUrl" placeholder="https://localhost:7010" />
  </label>
  <label>API key
    <input id="apiKey" type="password" />
  </label>
  <button id="save">Save</button>
  <div id="status"></div>

  <div id="context"></div>

  <script src="popup.js"></script>
</body>
</html>
